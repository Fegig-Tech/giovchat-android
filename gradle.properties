org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The one place to bump the SDK version (published coordinates app.giovchat:<module>:VERSION_NAME).
# GiovChatVersion.NAME must match it; a unit test and the release workflow check that.
GROUP=app.giovchat
VERSION_NAME=0.1.0

# Dokka 2 (v2 Gradle plugin mode) builds the -javadoc jars.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
